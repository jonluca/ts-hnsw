name: Release npm package

on:
  push:
    branches:
      - main
permissions:
  contents: write
  id-token: write
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "26.12.1"
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn test
      - run: npx semantic-release@25 --branches main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
